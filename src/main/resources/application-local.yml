spring:
  config:
    activate:
      on-profile: local
  datasource:
    driver-class-name: net.sf.log4jdbc.sql.jdbcapi.DriverSpy
    url: jdbc:log4jdbc:h2:tcp://localhost/~/peuteu
    username: sa
    password: 1234
  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true

logging: # log level
  level:
    web: info
    root: info
    com.yj.peuteu: info
#    org.hibernate.orm.jdbc.bind: trace
